
[font]
size=10


[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[window.padding]
x = 5
y = 5

[cursor.style]
blinking = "always"

[general]
import = [
        "~/.config/alacritty/themes/themes/monokai_charcoal.toml"
]

[env]
TERM = "xterm-256color"

[window]
opacity = 0.85
blur = true


[keyboard]
bindings = [
{ key = "F11", action = "ToggleFullscreen" }
]
